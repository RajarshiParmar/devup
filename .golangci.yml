run:
  timeout: 5m
  go: "1.24"

linters:
  enable:
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gofmt
    - goimports
    - misspell
    - revive
    - whitespace
    - unconvert
    - unparam
    - noctx
    - bodyclose
    - contextcheck
    - wrapcheck

linters-settings:
  goimports:
    local-prefixes: github.com/RajarshiParmar/devup
  revive:
    rules:
      - name: exported
        severity: warning
      - name: var-naming
      - name: package-comments
        disabled: true
  wrapcheck:
    ignorePackageGlobs:
      - github.com/RajarshiParmar/devup/*

issues:
  exclude-rules:
    - path: "_test.go"
      linters:
        - wrapcheck
        - errcheck
